<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Scheduler Visualizer</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Process Scheduler Visualizer</h1>
            <p>Round-Robin with Ready Queue • CPU • Blocked • Live Gantt</p>
        </header>

        <div class="controls">
            <label>Processes <input type="number" id="numProc" value="6" min="3" max="12"></label>
            <label>Time Quantum <input type="number" id="quantum" value="3" min="1" max="10"></label>
            <button id="startBtn">Start Simulation</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn" disabled>Reset</button>
            <label>Speed <input type="range" id="speed" min="1" max="10" value="4"> <span id="speedVal">4x</span></label>
        </div>

        <div class="clock-bar">
            <div class="clock">⏱ <span id="time">0</span></div>
            <div>Quantum: <strong id="qVal">3</strong></div>
            <div>Frame: <span id="frame">0</span> / <span id="total">0</span></div>
        </div>

        <div class="layout">
            <!-- LEFT: Process Table -->
            <section class="panel process-table">
                <h2>Process Table (PCB)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>PID</th>
                            <th>State</th>
                            <th>Arrival</th>
                            <th>Burst</th>
                            <th>Remaining</th>
                        </tr>
                    </thead>
                    <tbody id="procBody"></tbody>
                </table>
            </section>

            <!-- CENTER -->
            <section class="center">
                <div class="ready-queue panel">
                    <h2>Ready Queue</h2>
                    <div id="readyQueue" class="queue"></div>
                </div>

                <div class="cpu-box panel">
                    <h2>CPU</h2>
                    <div id="cpu" class="cpu">
                        <div class="cpu-label">IDLE</div>
                        <div class="progress"><div id="progressBar"></div></div>
                        <div class="quantum-left">Quantum left: <span id="qLeft">–</span></div>
                    </div>
                </div>

                <div class="blocked panel">
                    <h2>Blocked (I/O)</h2>
                    <div id="blockedQueue" class="queue"></div>
                </div>
            </section>

            <!-- RIGHT: Gantt + Metrics -->
            <section class="panel gantt-panel">
                <h2>Live Gantt Chart</h2>
                <div id="gantt" class="gantt"></div>

                <div class="metrics">
                    <div>Avg Waiting Time: <strong id="avgWait">–</strong></div>
                    <div>Avg Turnaround: <strong id="avgTurn">–</strong></div>
                    <div>Total Time: <strong id="totalTime">–</strong></div>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
